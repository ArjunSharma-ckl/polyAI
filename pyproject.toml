[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyai"
version = "0.1.0"
description = "One import. Every AI. — Universal Python client for all major AI providers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["openai", "anthropic", "claude", "gemini", "grok", "ai", "llm", "gpt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.0",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
    "cohere>=5.0",
    "mistralai>=0.4",
]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ArjunS/polyAI"
Repository = "https://github.com/ArjunS/polyAI"
Issues = "https://github.com/ArjunS/polyAI/issues"

[tool.setuptools.packages.find]
include = ["polyai*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]
