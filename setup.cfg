[metadata]
name = polyai
version = 0.1.0
description = One import. Every AI. Universal Python client for all major AI providers.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.31
    httpx>=0.27
    python-dotenv>=1.0
    rich>=13.0

[options.packages.find]
include = polyai*
